<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Динар · Персональная страница</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body {
            background: radial-gradient(circle at 10% 20%, #0d0e1a 0%, #05060d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            width: 100%;
            background: rgba(20, 22, 45, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 30px 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            text-align: center;
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .header .icon-btn {
            width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 255, 255, 0.05);
            display: flex; align-items: center; justify-content: center; color: #fff; cursor: pointer; transition: 0.3s; font-size: 18px;
        }
        .header .icon-btn:hover { background: rgba(255, 255, 255, 0.15); }
        
        .profile-avatar {
            width: 120px; height: 120px; border-radius: 50%; margin: 0 auto 15px;
            background: linear-gradient(135deg, #7a42f4, #b23cfd); padding: 3px;
        }
        .profile-avatar img { width: 100%; height: 100%; border-radius: 50%; border: 3px solid #0d0e1a; }
        .profile-name { font-weight: 800; font-size: 26px; color: #fff; margin-bottom: 5px; }
        .profile-username { font-size: 14px; color: #a0a3bd; font-weight: 400; margin-bottom: 15px; }
        .quote-box {
            background: rgba(255, 255, 255, 0.05); border-radius: 12px; padding: 12px 20px;
            margin-bottom: 25px; border-left: 3px solid #7a42f4; color: #c8cbe5; font-size: 14px;
        }
        
        .menu-btn {
            display: block; width: 100%; padding: 16px; margin-bottom: 12px;
            background: linear-gradient(135deg, rgba(80, 50, 150, 0.3), rgba(30, 20, 80, 0.3));
            border: 1px solid rgba(122, 66, 244, 0.2); border-radius: 16px;
            color: #e2e5ff; font-weight: 600; font-size: 16px; text-decoration: none;
            transition: 0.3s; cursor: pointer;
        }
        .menu-btn:hover { background: rgba(122, 66, 244, 0.2); border-color: #7a42f4; transform: scale(1.02); color: #fff; }
        .menu-btn i { font-size: 18px; }
        
        /* Форма заказа (изначально скрыта) */
        #order-form {
            display: none; margin-top: 20px; background: rgba(255, 255, 255, 0.05);
            border-radius: 16px; padding: 20px; text-align: left;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; color: #c8cbe5; font-size: 14px; margin-bottom: 5px; }
        .form-group input, .form-group select {
            width: 100%; padding: 10px; border-radius: 8px;
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff; font-size: 14px; outline: none;
        }
        .form-group input:focus, .form-group select:focus { border-color: #7a42f4; }
        .submit-btn {
            width: 100%; padding: 12px; border: none; border-radius: 10px;
            background: linear-gradient(135deg, #7a42f4, #b23cfd); color: #fff; font-weight: 600;
            cursor: pointer; transition: 0.3s;
        }
        .submit-btn:hover { transform: scale(1.02); }
        .back-btn {
            display: block; text-align: center; margin-top: 15px; color: #a0a3bd;
            text-decoration: none; font-size: 14px; cursor: pointer;
        }
        .back-btn:hover { color: #fff; }
        
        .stats-box { background: rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 15px; margin-top: 20px; }
        .stats-header { color: #a0a3bd; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .stats-icons { display: flex; justify-content: center; gap: 15px; }
        .stat-item {
            background: rgba(255, 255, 255, 0.05); padding: 8px 20px; border-radius: 30px;
            display: flex; align-items: center; gap: 8px; color: #fff; font-size: 14px;
        }
        .stat-item span { color: #a0a3bd; }
        .bio-section { margin-top: 20px; background: rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 20px; text-align: left; }
        .bio-title { color: #7a42f4; font-weight: 600; font-size: 16px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .bio-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); color: #c8cbe5; font-size: 14px; }
        .bio-item:last-child { border-bottom: none; }
        .bio-item .label { display: flex; align-items: center; gap: 8px; color: #a0a3bd; }
        .bio-item .value { font-weight: 500; color: #fff; }
        #status-msg { margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="icon-btn">☀️</div>
        <div class="icon-btn">🌐</div>
    </div>

    <div class="profile-avatar">
        <img src="https://via.placeholder.com/150" alt="Аватар">
    </div>
    <div class="profile-name">Динар</div>
    <div class="profile-username">@crdkl</div>

    <div class="quote-box">🖤 В космосе тайны становятся явью...</div>

    <!-- Главное меню -->
    <div id="main-menu">
        <a href="#" class="menu-btn" onclick="showBio()">👤 Обо мне</a>
        <a href="#" class="menu-btn" onclick="showOrderForm()">🎁 Купить звёзды ⭐</a>
        <a href="#" class="menu-btn">🔗 Мои ссылки</a>
    </div>

    <!-- Секция Обо мне (скрыта по умолчанию) -->
    <div id="bio-section" class="bio-section" style="display: none;">
        <div class="bio-title">👤 Биография</div>
        <div class="bio-item"><span class="label">🪐 Имя</span><span class="value">Динар</span></div>
        <div class="bio-item"><span class="label">🌙 Возраст</span><span class="value">19 лет</span></div>
        <div class="bio-item"><span class="label">💬 Контакты</span><span class="value">@crdkl</span></div>
        <div class="bio-item"><span class="label">🏳️ Языки</span><span class="value">Башкирский, Русский</span></div>
        <div class="bio-item"><span class="label">🎂 День рождения</span><span class="value">24.06.2007</span></div>
        <a href="#" class="back-btn" onclick="hideBio()">← Назад</a>
    </div>

    <!-- Форма заказа (скрыта по умолчанию) -->
    <div id="order-form">
        <h3 style="color: #fff; margin-bottom: 15px;">⭐ Купить звёзды</h3>
        <div class="form-group">
            <label>Количество звёзд</label>
            <select id="stars_count">
                <option value="50">50 ⭐</option>
                <option value="100">100 ⭐</option>
                <option value="250">250 ⭐</option>
                <option value="500">500 ⭐</option>
            </select>
        </div>
        <div class="form-group">
            <label>Username получателя (без @)</label>
            <input type="text" id="receiver_username" placeholder="crdkl">
        </div>
        <button class="submit-btn" onclick="sendOrder()">Отправить заказ</button>
        <a href="#" class="back-btn" onclick="hideOrderForm()">← Назад</a>
        <div id="status-msg"></div>
    </div>

    <div class="stats-box">
        <div class="stats-header">👁️ Просмотров профиля: 0</div>
        <div class="stats-icons">
            <div class="stat-item">❤️ <span>0</span></div>
            <div class="stat-item">🔥 <span>0</span></div>
            <div class="stat-item">⭐ <span>0</span></div>
        </div>
    </div>
</div>

<script>
    // --- Показ/скрытие секций ---
    function showBio() {
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('bio-section').style.display = 'block';
    }
    function hideBio() {
        document.getElementById('main-menu').style.display = 'block';
        document.getElementById('bio-section').style.display = 'none';
    }
    function showOrderForm() {
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('order-form').style.display = 'block';
    }
    function hideOrderForm() {
        document.getElementById('main-menu').style.display = 'block';
        document.getElementById('order-form').style.display = 'none';
        document.getElementById('status-msg').innerText = '';
    }

    // --- Отправка заказа в Telegram (без сервера) ---
    async function sendOrder() {
        const count = document.getElementById('stars_count').value;
        const receiver = document.getElementById('receiver_username').value.trim();
        const statusMsg = document.getElementById('status-msg');

        if (!receiver) {
            statusMsg.style.color = '#ff5555';
            statusMsg.innerText = '⚠️ Введите username получателя!';
            return;
        }

        statusMsg.innerText = '⏳ Отправка...';
        statusMsg.style.color = '#7a42f4';

        // ✅ ВАШ ТОКЕН АДМИН-БОТА И ID
        const BOT_TOKEN = "8849713309:AAFJaikdyfeuggToQ1Yv7fttVn7_WQt0wOI";
        const ADMIN_CHAT_ID = "6305430094";

        const message = `🛒 **НОВЫЙ ЗАКАЗ С САЙТА!**\n\n⭐ Количество: ${count} шт.\n👤 Получатель: @${receiver}\n🕐 Время: ${new Date().toLocaleString()}`;

        try {
            const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: ADMIN_CHAT_ID,
                    text: message,
                    parse_mode: 'Markdown'
                })
            });

            if (response.ok) {
                statusMsg.style.color = '#4caf50';
                statusMsg.innerText = '✅ Заказ отправлен! Проверьте админ-бота.';
            } else {
                statusMsg.style.color = '#ff5555';
                statusMsg.innerText = '❌ Ошибка отправки.';
            }
        } catch (error) {
            statusMsg.style.color = '#ff5555';
            statusMsg.innerText = '❌ Ошибка соединения.';
        }
    }
</script>

</body>
</html>
