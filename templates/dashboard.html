<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarSeller Админ-панель</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0d0e1a;
            color: #fff;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #7a42f4;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .order-card {
            background: #1a1c2e;
            border-radius: 12px;
            padding: 16px;
            margin: 12px 0;
            border-left: 4px solid #7a42f4;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .order-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .order-id {
            font-weight: 600;
            color: #7a42f4;
        }
        .order-detail {
            color: #a0a3bd;
            font-size: 14px;
        }
        .btn-confirm {
            background: #28a745;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        .btn-confirm:hover {
            background: #218838;
            transform: scale(1.02);
        }
        .no-orders {
            text-align: center;
            color: #a0a3bd;
            margin-top: 40px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h1>📦 Заказы StarSeller</h1>
    
    <div id="orders-list">
        {% if orders %}
            {% for order in orders %}
            <div class="order-card">
                <div class="order-info">
                    <div class="order-id">Заказ #{{ order.id }}</div>
                    <div class="order-detail">👤 @{{ order.username }}</div>
                    <div class="order-detail">⭐ {{ order.amount }} звёзд</div>
                </div>
                <button class="btn-confirm" onclick="confirmOrder({{ order.id }}, '{{ order.username }}', {{ order.amount }}, {{ order.chat_id }})">
                    ✅ Подтвердить
                </button>
            </div>
            {% endfor %}
        {% else %}
            <div class="no-orders">✨ Пока нет заказов</div>
        {% endif %}
    </div>

    <script>
        function confirmOrder(orderId, username, amount, chatId) {
            const btn = event.target;
            btn.textContent = "⏳ Обработка...";
            btn.disabled = true;

            fetch('/api/confirm_order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    order_id: orderId, 
                    username: username, 
                    amount: amount, 
                    chat_id: chatId 
                })
            })
            .then(response => {
                if (response.ok) {
                    btn.textContent = "✅ Подтверждено";
                    btn.style.background = "#6c757d";
                    alert('✅ Заказ подтверждён! Клиент получил уведомление.');
                } else {
                    btn.textContent = "❌ Ошибка";
                    btn.style.background = "#dc3545";
                }
            })
            .catch(err => {
                btn.textContent = "❌ Ошибка";
                btn.style.background = "#dc3545";
            });
        }
    </script>
</body>
</html>
